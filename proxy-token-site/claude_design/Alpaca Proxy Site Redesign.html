<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Options Proxy — Public Docs Site Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
  body { font-family: "IBM Plex Sans", system-ui, sans-serif; }
  #root { height: 100%; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="docs-site.jsx"></script>
<script type="text/babel" src="token-page.jsx"></script>
<script type="text/babel" src="register-page.jsx"></script>

<script type="text/babel" data-presets="react">
  function App() {
    return (
      <DesignCanvas>
        <DCSection
          id="docs"
          title="Public Docs Site"
          subtitle="Top bar · Proxy API / WS usage (Reports removed) · 3-column docs layout. Reads from the markdown repo."
        >
          <DCArtboard id="docs-proxy" label="Docs · Proxy API" width={1280} height={820}>
            <DocsSite />
          </DCArtboard>
        </DCSection>

        <DCSection
          id="portal"
          title="Token Portal · index.html"
          subtitle="Same shell + topbar. Left pane = generator form, right pane = embedded docs preview. Aesthetic now matches the docs."
        >
          <DCArtboard id="portal-token" label="Portal · Generate" width={1280} height={820}>
            <TokenPage />
          </DCArtboard>
        </DCSection>

        <DCSection
          id="register"
          title="Registration · register.html"
          subtitle="Re-skinned from the dark-card original. Same type, palette, and tier vocabulary as the docs surface."
        >
          <DCArtboard id="register-new" label="Register · light, integrated" width={1280} height={820}>
            <RegisterPage />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
