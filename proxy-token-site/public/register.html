<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - Websocket DataFeed Proxy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #1a1d27; border-radius: 12px; padding: 40px; width: 100%; max-width: 460px; box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
        h1 { font-size: 22px; margin-bottom: 6px; color: #fff; }
        .subtitle { color: #888; font-size: 13px; margin-bottom: 28px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; font-weight: 500; }
        input { width: 100%; padding: 10px 12px; background: #252830; border: 1px solid #333; border-radius: 6px; color: #e0e0e0; font-size: 14px; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #5b8dee; }
        input::placeholder { color: #555; }
        .tier-info { margin-bottom: 20px; }
        .tier-info-item { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-bottom: 1px solid #2a2d37; }
        .tier-info-item:last-child { border-bottom: none; }
        .tier-info-name { font-size: 13px; font-weight: 600; color: #ccc; }
        .tier-info-desc { font-size: 12px; color: #666; }
        .tier-options { display: flex; gap: 8px; }
        .tier-option { flex: 1; padding: 14px 10px; background: #252830; border: 2px solid #333; border-radius: 8px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .tier-option:hover { border-color: #555; }
        .tier-option.active { border-color: #5b8dee; background: #1e2a3d; }
        .tier-option .tier-name { font-size: 15px; font-weight: 600; color: #fff; }
        .tier-option .tier-desc { font-size: 11px; color: #888; margin-top: 4px; }
        button[type="submit"], .submit-btn { width: 100%; padding: 12px; background: #5b8dee; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        button[type="submit"]:hover, .submit-btn:hover { background: #4a7cdd; }
        button[type="submit"]:disabled, .submit-btn:disabled { background: #333; cursor: not-allowed; }
        .msg { margin-top: 16px; padding: 10px 14px; border-radius: 6px; font-size: 13px; display: none; }
        .msg.success { display: block; background: #1a3a2a; color: #6fcf97; border: 1px solid #2d5a3d; }
        .msg.error { display: block; background: #3a1a1a; color: #f07171; border: 1px solid #5a2d2d; }
        .msg.pending { display: block; background: #2a2a1a; color: #f0d060; border: 1px solid #5a4a2d; }
        .footer { text-align: center; margin-top: 20px; }
        .footer a { color: #5b8dee; text-decoration: none; font-size: 13px; }
        .footer a:hover { text-decoration: underline; }
        .divider { border: none; border-top: 1px solid #2a2d37; margin: 20px 0; }
        .check-section { background: #16181f; border-radius: 8px; padding: 16px; margin-top: 20px; }
        .check-section h3 { font-size: 14px; color: #aaa; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📋 新用户注册</h1>
        <p class="subtitle">选择套餐并填写信息，管理员确认后自助生成 Token</p>

        <div class="tier-info">
            <div class="tier-info-item">
                <div class="tier-info-name">Basic — 20/月</div>
                <div class="tier-info-desc">股票/新闻实时流 + 10 symbols</div>
            </div>
            <div class="tier-info-item">
                <div class="tier-info-name">Standard — 50/月</div>
                <div class="tier-info-desc">股票/期权/crypto/新闻 + 100 symbols + 历史数据</div>
            </div>
            <div class="tier-info-item">
                <div class="tier-info-name">Premium — 100/月</div>
                <div class="tier-info-desc">全部实时流 + 500 symbols + 全部历史数据 + 无限制 REST</div>
            </div>
        </div>

        <form id="register-form">
            <div class="form-group">
                <label for="username">设置用户名</label>
                <input type="text" id="username" placeholder="英文字母，用于后续登录" required>
            </div>
            <div class="form-group">
                <label for="phone">手机号</label>
                <input type="text" id="phone" placeholder="下单时使用的手机号" required>
            </div>
            <div class="form-group">
                <label>服务等级</label>
                <div class="tier-options">
                    <div class="tier-option active" data-tier="premium" onclick="selectTier(this)">
                        <div class="tier-name">Premium</div>
                        <div class="tier-desc">100/月 · 全功能</div>
                    </div>
                    <div class="tier-option" data-tier="standard" onclick="selectTier(this)">
                        <div class="tier-name">Standard</div>
                        <div class="tier-desc">50/月 · 进阶</div>
                    </div>
                    <div class="tier-option" data-tier="basic" onclick="selectTier(this)">
                        <div class="tier-name">Basic</div>
                        <div class="tier-desc">20/月 · 入门</div>
                    </div>
                </div>
            </div>
            <input type="hidden" id="tier" value="premium">
            <button type="submit">提交注册</button>
        </form>

        <div id="msg" class="msg"></div>

        <hr class="divider">

        <div class="check-section">
            <h3>🔍 查询审核状态</h3>
            <div class="form-group">
                <input type="text" id="check_username" placeholder="用户名">
            </div>
            <div class="form-group">
                <input type="text" id="check_phone" placeholder="手机号">
            </div>
            <button class="submit-btn" style="background:#2a2d37;color:#aaa;border:1px solid #333;font-size:13px;" onclick="checkStatus()">查询状态</button>
            <div id="check-msg" class="msg" style="margin-top:10px;"></div>
        </div>

        <div class="footer">
            <a href="/">已有账号？去生成 Token →</a>
        </div>
    </div>

    <script>
        let selectedTier = 'premium';

        function selectTier(el) {
            document.querySelectorAll('.tier-option').forEach(o => o.classList.remove('active'));
            el.classList.add('active');
            selectedTier = el.dataset.tier;
            document.getElementById('tier').value = selectedTier;
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const msg = document.getElementById('msg');
            msg.className = 'msg';
            msg.style.display = 'none';
            btn.disabled = true;
            btn.textContent = '提交中...';

            try {
                const resp = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        phone: document.getElementById('phone').value,
                        tier: selectedTier
                    })
                });
                const data = await resp.json();
                msg.textContent = data.message;
                msg.className = data.success ? 'msg success' : 'msg error';
                msg.style.display = 'block';
                if (data.success) e.target.reset();
            } catch (err) {
                msg.textContent = '网络错误，请稍后再试。';
                msg.className = 'msg error';
                msg.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = '提交注册';
            }
        });

        async function checkStatus() {
            const msg = document.getElementById('check-msg');
            msg.style.display = 'none';
            try {
                const resp = await fetch('/api/check-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('check_username').value,
                        phone: document.getElementById('check_phone').value
                    })
                });
                const data = await resp.json();
                msg.textContent = data.message;
                msg.style.display = 'block';
                if (data.status === 'approved') msg.className = 'msg success';
                else if (data.status === 'rejected') msg.className = 'msg error';
                else if (data.status === 'pending') msg.className = 'msg pending';
                else msg.className = 'msg error';
            } catch (err) {
                msg.textContent = '网络错误';
                msg.className = 'msg error';
                msg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
