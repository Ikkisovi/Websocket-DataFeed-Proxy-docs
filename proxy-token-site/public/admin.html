<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — 审核后台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas:   #f7f5f0;
      --bg-paper:    #ffffff;
      --bg-sunken:   #f1eee6;
      --bg-code:     #1a1815;

      --ink-strong:  #1a1815;
      --ink-base:    #3a3530;
      --ink-muted:   #7a716a;
      --ink-soft:    #b0a89e;
      --ink-inverse: #f7f5f0;

      --rule:        #e8e2d6;
      --rule-strong: #d8d0c2;

      --accent:      oklch(0.52 0.09 195);
      --accent-ink:  oklch(0.42 0.09 195);
      --accent-soft: oklch(0.95 0.025 195);

      --ok:          oklch(0.55 0.10 155);
      --ok-soft:     oklch(0.95 0.025 155);
      --ok-muted:    oklch(0.92 0.04 155);
      --danger:      oklch(0.55 0.14 25);
      --danger-soft: oklch(0.95 0.03 25);
      --danger-muted:oklch(0.92 0.04 25);
      --warn:        oklch(0.65 0.12 75);
      --warn-soft:   oklch(0.95 0.04 75);

      --f-display: "Instrument Serif", Georgia, serif;
      --f-sans:    "IBM Plex Sans", system-ui, sans-serif;
      --f-mono:    "IBM Plex Mono", ui-monospace, monospace;

      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--f-sans);
      font-size: 14px;
      line-height: 1.55;
      color: var(--ink-base);
      background: var(--bg-canvas);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Topbar ── */
    .topbar {
      display: flex; align-items: center; gap: 16px;
      height: 56px; padding: 0 24px;
      background: var(--bg-paper);
      border-bottom: 1px solid var(--rule);
      position: sticky; top: 0; z-index: 10;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--f-mono); font-size: 11px;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--ink-muted);
    }
    .brand .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .brand strong { color: var(--ink-strong); font-weight: 500; }
    .topbar-divider { width: 1px; height: 18px; background: var(--rule); }
    .topbar-title {
      font-family: var(--f-sans); font-size: 13px; font-weight: 500;
      color: var(--ink-strong);
    }
    .topbar-spacer { flex: 1; }
    .topbar-meta {
      display: flex; align-items: center; gap: 16px;
      font-family: var(--f-mono); font-size: 11px; color: var(--ink-muted);
    }
    .stat-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 999px;
      border: 1px solid var(--rule); background: var(--bg-paper);
      font-family: var(--f-mono); font-size: 11px; color: var(--ink-muted);
    }
    .stat-chip .n { color: var(--ink-strong); font-weight: 600; }
    .stat-chip.pending-chip .n { color: var(--warn); }

    /* ── Buttons ── */
    .btn {
      font-family: var(--f-sans); font-size: 13px; font-weight: 500;
      padding: 8px 14px; border-radius: var(--radius-md);
      border: 1px solid var(--rule-strong); background: var(--bg-paper);
      color: var(--ink-strong); cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      transition: background .12s, border-color .12s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--bg-sunken); border-color: var(--ink-soft); }
    .btn:active { transform: translateY(0.5px); }
    .btn.ghost { background: transparent; border-color: transparent; }
    .btn.ghost:hover { background: var(--bg-sunken); border-color: var(--rule); }
    .btn.approve {
      background: var(--ok-muted); border-color: oklch(0.80 0.06 155);
      color: oklch(0.38 0.10 155);
    }
    .btn.approve:hover { background: oklch(0.88 0.05 155); }
    .btn.reject {
      background: var(--danger-muted); border-color: oklch(0.82 0.06 25);
      color: oklch(0.42 0.12 25);
    }
    .btn.reject:hover { background: oklch(0.88 0.05 25); }

    /* ── Inputs ── */
    .input {
      width: 100%; font-family: var(--f-sans); font-size: 14px;
      padding: 10px 12px;
      border: 1px solid var(--rule-strong); border-radius: var(--radius-md);
      background: var(--bg-paper); color: var(--ink-strong); outline: none;
      transition: border-color .12s, box-shadow .12s;
    }
    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .input::placeholder { color: var(--ink-soft); }
    .input[type="password"] { font-family: var(--f-mono); letter-spacing: 0.1em; }

    /* ── Login overlay ── */
    .login-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: var(--bg-canvas);
      display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      background: var(--bg-paper); border: 1px solid var(--rule);
      border-radius: var(--radius-lg); padding: 40px 36px; width: 380px;
      box-shadow: 0 4px 24px rgba(26,24,21,0.07);
    }
    .login-eyebrow {
      font-family: var(--f-mono); font-size: 10.5px;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--accent-ink); margin-bottom: 10px;
    }
    .login-title {
      font-family: var(--f-display); font-size: 32px; font-weight: 400;
      color: var(--ink-strong); margin-bottom: 24px; line-height: 1.1;
    }
    .login-label {
      font-family: var(--f-mono); font-size: 10.5px;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--ink-muted); display: block; margin-bottom: 6px;
    }
    .login-error {
      font-size: 12px; color: var(--danger);
      margin-top: 10px; display: none;
    }
    .login-submit {
      margin-top: 20px; width: 100%; padding: 12px;
      font-family: var(--f-sans); font-size: 14px; font-weight: 500;
      border: none; border-radius: var(--radius-md);
      background: var(--ink-strong); color: var(--ink-inverse);
      cursor: pointer; transition: background .12s;
    }
    .login-submit:hover { background: #000; }

    /* ── Tab strip ── */
    .tab-strip {
      display: flex; gap: 0;
      background: var(--bg-paper);
      border-bottom: 1px solid var(--rule);
      padding: 0 24px;
    }
    .tab {
      padding: 14px 0; margin-right: 28px;
      font-size: 13px; font-weight: 500; cursor: pointer;
      color: var(--ink-muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      display: flex; align-items: baseline; gap: 7px;
      transition: color .12s;
    }
    .tab:hover { color: var(--ink-strong); }
    .tab.active { color: var(--ink-strong); border-bottom-color: var(--ink-strong); }
    .tab .count {
      font-family: var(--f-mono); font-size: 11px;
      color: var(--ink-soft); font-weight: 400;
    }
    .tab.active .count { color: var(--ink-muted); }

    /* ── Content ── */
    .content { max-width: 860px; margin: 0 auto; padding: 28px 24px; }

    /* ── User cards ── */
    .user-card {
      background: var(--bg-paper); border: 1px solid var(--rule);
      border-radius: var(--radius-lg); padding: 18px 20px;
      margin-bottom: 10px;
      transition: border-color .15s, box-shadow .15s;
    }
    .user-card:hover { border-color: var(--rule-strong); box-shadow: 0 2px 8px rgba(26,24,21,0.05); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card-username {
      font-size: 15px; font-weight: 600; color: var(--ink-strong);
      display: flex; align-items: center; gap: 8px;
    }
    .card-badges { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    /* tier chip */
    .tier {
      display: inline-flex; align-items: center; gap: 4px;
      font-family: var(--f-mono); font-size: 10.5px;
      letter-spacing: 0.04em; text-transform: uppercase;
      padding: 2px 7px 2px 6px; border-radius: var(--radius-sm);
      border: 1px solid var(--rule); color: var(--ink-base);
      background: var(--bg-paper);
    }
    .tier::before {
      content: ""; width: 5px; height: 5px; border-radius: 50%;
      background: var(--ink-soft);
    }
    .tier.premium::before     { background: oklch(0.55 0.13 295); }
    .tier.limited_premium::before { background: var(--accent); }
    .tier.basic::before       { background: oklch(0.65 0.12 75); }

    /* status chip */
    .status-chip {
      display: inline-flex; align-items: center; gap: 5px;
      font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.04em;
      padding: 2px 8px; border-radius: 999px; border: 1px solid var(--rule);
    }
    .status-chip::before {
      content: ""; width: 5px; height: 5px; border-radius: 50%;
    }
    .status-chip.pending  { background: var(--warn-soft);   border-color: oklch(0.88 0.06 75);  color: oklch(0.45 0.12 75); }
    .status-chip.pending::before  { background: var(--warn); }
    .status-chip.approved { background: var(--ok-soft);     border-color: oklch(0.88 0.05 155); color: oklch(0.38 0.10 155); }
    .status-chip.approved::before { background: var(--ok); }
    .status-chip.rejected { background: var(--danger-soft); border-color: oklch(0.88 0.05 25);  color: oklch(0.42 0.12 25); }
    .status-chip.rejected::before { background: var(--danger); }

    .card-meta {
      margin-top: 10px;
      display: flex; gap: 20px; flex-wrap: wrap;
      font-size: 12.5px; color: var(--ink-muted);
    }
    .card-meta .meta-label { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-soft); margin-right: 3px; text-transform: uppercase; letter-spacing: 0.08em; }
    .card-meta .mono { font-family: var(--f-mono); font-size: 12px; color: var(--ink-base); }

    .card-actions {
      margin-top: 14px; padding-top: 14px;
      border-top: 1px solid var(--rule);
      display: flex; gap: 8px; align-items: center;
    }

    /* token result box */
    .token-result {
      margin-top: 10px; padding: 10px 12px;
      background: var(--bg-sunken); border: 1px solid var(--rule);
      border-radius: var(--radius-md);
      font-family: var(--f-mono); font-size: 12px;
      color: var(--ink-base);
      display: none;
    }
    .token-result.visible { display: block; }
    .token-result .token-val {
      color: oklch(0.42 0.09 195); word-break: break-all;
    }

    /* reject input row */
    .reject-row {
      display: none; gap: 8px; align-items: center;
      flex: 1;
    }
    .reject-row.open { display: flex; }
    .reject-row .input {
      flex: 1; padding: 7px 10px; font-size: 13px;
    }

    /* ── Empty & section label ── */
    .empty {
      text-align: center; padding: 48px 24px;
      color: var(--ink-soft); font-size: 14px;
    }
    .section-eyebrow {
      font-family: var(--f-mono); font-size: 10.5px;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--accent-ink); margin-bottom: 14px;
    }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 200;
      padding: 12px 18px; border-radius: var(--radius-md);
      font-size: 13px; font-weight: 500;
      border: 1px solid var(--rule);
      background: var(--bg-paper); color: var(--ink-base);
      box-shadow: 0 4px 20px rgba(26,24,21,0.12);
      display: none;
      animation: slideIn .25s ease;
    }
    .toast.success { background: var(--ok-soft); border-color: oklch(0.85 0.05 155); color: oklch(0.35 0.10 155); }
    .toast.error   { background: var(--danger-soft); border-color: oklch(0.85 0.05 25); color: oklch(0.40 0.12 25); }
    .toast.show    { display: block; }
    @keyframes slideIn { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .hidden { display: none !important; }

    /* ── Divider rule ── */
    hr.rule { border: none; border-top: 1px solid var(--rule); margin: 24px 0; }
  </style>
</head>
<body>

<!-- ── Login overlay ── -->
<div id="login-overlay" class="login-overlay">
  <div class="login-card">
    <div class="login-eyebrow">Proxy Token Site</div>
    <div class="login-title">Admin 登录</div>
    <label class="login-label" for="admin-password">管理员密码</label>
    <input class="input" type="password" id="admin-password" placeholder="输入密码"
      onkeydown="if(event.key==='Enter')adminLogin()">
    <div id="login-error" class="login-error">密码错误，请重试。</div>
    <button class="login-submit" onclick="adminLogin()">登录</button>
  </div>
</div>

<!-- ── Main app ── -->
<div id="app" class="hidden">

  <!-- Topbar -->
  <div class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span><strong>Proxy Token Site</strong></span>
    </div>
    <div class="topbar-divider"></div>
    <span class="topbar-title">审核后台</span>
    <div class="topbar-spacer"></div>
    <div class="topbar-meta">
      <div class="stat-chip pending-chip">
        待审核 <span class="n" id="stat-pending">0</span>
      </div>
      <div class="stat-chip">
        已批准 <span class="n" id="stat-approved">0</span>
      </div>
      <button class="btn ghost" onclick="loadData()" title="刷新数据">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M13.5 8A5.5 5.5 0 1 1 10 3.07" stroke-linecap="round"/>
          <polyline points="10,1 10,4 13,4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        刷新
      </button>
    </div>
  </div>

  <!-- Tab strip -->
  <div class="tab-strip">
    <div class="tab active" data-tab="pending" onclick="switchTab(this)">
      待审核 <span class="count" id="tab-count-pending">0</span>
    </div>
    <div class="tab" data-tab="all" onclick="switchTab(this)">
      全部记录 <span class="count" id="tab-count-all">0</span>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <div id="list-pending"></div>
    <div id="list-all" class="hidden"></div>
  </div>

</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script>
  let adminToken = null;

  /* ── Toast ── */
  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + (type || '');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.className = 'toast'; }, 3500);
  }

  /* ── Login ── */
  async function adminLogin() {
    const pw = document.getElementById('admin-password').value;
    const err = document.getElementById('login-error');
    err.style.display = 'none';
    try {
      const resp = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw })
      });
      const data = await resp.json();
      if (data.success) {
        adminToken = data.token;
        document.getElementById('login-overlay').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        loadData();
      } else {
        err.style.display = 'block';
      }
    } catch {
      err.textContent = '连接失败，请检查网络。';
      err.style.display = 'block';
    }
  }

  /* ── Tabs ── */
  function switchTab(el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    const tab = el.dataset.tab;
    document.getElementById('list-pending').classList.toggle('hidden', tab !== 'pending');
    document.getElementById('list-all').classList.toggle('hidden', tab !== 'all');
  }

  /* ── Load data ── */
  async function loadData() {
    try {
      const h = { 'X-Admin-Token': adminToken };
      const [pr, ar] = await Promise.all([
        fetch('/api/admin/pending', { headers: h }),
        fetch('/api/admin/all',     { headers: h })
      ]);
      if (pr.status === 401 || ar.status === 401) { location.reload(); return; }

      const pd = await pr.json();
      const ad = await ar.json();
      const pending = pd.items || [];
      const all     = ad.items || [];
      const approved = all.filter(i => i.status === 'approved').length;

      document.getElementById('stat-pending').textContent  = pending.length;
      document.getElementById('stat-approved').textContent = approved;
      document.getElementById('tab-count-pending').textContent = pending.length;
      document.getElementById('tab-count-all').textContent     = all.length;

      renderList('list-pending', pending, true);
      renderList('list-all',     all,     false);
    } catch (e) {
      showToast('加载失败: ' + e.message, 'error');
    }
  }

  /* ── Render list ── */
  function tierLabel(t) {
    if (!t) return 'unknown';
    return t === 'limited_premium' ? 'Lim. Premium'
         : t.charAt(0).toUpperCase() + t.slice(1);
  }

  function statusLabel(s) {
    if (s === 'approved') return '已批准';
    if (s === 'rejected') return '已拒绝';
    return '待审核';
  }

  function renderList(id, items, showActions) {
    const el = document.getElementById(id);
    if (!items.length) {
      el.innerHTML = '<div class="empty">暂无记录</div>';
      return;
    }
    el.innerHTML = items.map(item => {
      const tier = item.tier || item.role || '';
      const time = item.registered_at
        ? new Date(item.registered_at).toLocaleString('zh-CN', { dateStyle: 'medium', timeStyle: 'short' })
        : '—';
      const status = item.status || 'pending';

      const actionsBtns = showActions ? `
        <div class="card-actions" id="actions-${item.id}">
          <button class="btn approve" onclick="startApprove('${item.id}')">批准</button>
          <button class="btn reject"  onclick="toggleReject('${item.id}')">拒绝</button>
          <div class="reject-row" id="reject-row-${item.id}">
            <input class="input" type="text" id="reject-reason-${item.id}" placeholder="拒绝原因（可选）"
              onkeydown="if(event.key==='Enter')confirmReject('${item.id}')">
            <button class="btn reject" onclick="confirmReject('${item.id}')">确认拒绝</button>
            <button class="btn ghost"  onclick="toggleReject('${item.id}')">取消</button>
          </div>
          <div class="token-result" id="token-result-${item.id}"></div>
        </div>` : '';

      const rejectReason = item.reject_reason
        ? `<span><span class="meta-label">原因</span>${item.reject_reason}</span>` : '';

      return `
        <div class="user-card" id="card-${item.id}">
          <div class="card-top">
            <span class="card-username">${escHtml(item.username || '—')}</span>
            <div class="card-badges">
              <span class="tier ${tier}">${tierLabel(tier)}</span>
              ${!showActions ? `<span class="status-chip ${status}">${statusLabel(status)}</span>` : ''}
            </div>
          </div>
          <div class="card-meta">
            <span><span class="meta-label">手机</span><span class="mono">${escHtml(item.phone || '—')}</span></span>
            <span><span class="meta-label">注册</span>${time}</span>
            ${rejectReason}
          </div>
          ${actionsBtns}
        </div>`;
    }).join('');
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Approve ── */
  async function startApprove(id) {
    const btn = document.querySelector(`#actions-${id} .btn.approve`);
    btn.disabled = true;
    btn.textContent = '处理中…';
    try {
      const resp = await fetch('/api/admin/approve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
        body: JSON.stringify({ id })
      });
      const data = await resp.json();
      if (data.success) {
        showToast(data.message, 'success');
        if (data.token) {
          const box = document.getElementById(`token-result-${id}`);
          box.innerHTML = `<span style="font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)">Token&nbsp;</span><span class="token-val">${data.token}</span>
            <br><span style="color:var(--ink-soft);font-size:11px">有效期至 ${data.expiry ? new Date(data.expiry).toLocaleDateString('zh-CN') : '—'}</span>`;
          box.classList.add('visible');
          const actionsEl = document.getElementById(`actions-${id}`);
          actionsEl.querySelectorAll('.btn').forEach(b => b.remove());
        }
        loadData();
      } else {
        showToast(data.message || '操作失败', 'error');
        btn.disabled = false;
        btn.textContent = '批准';
      }
    } catch {
      showToast('请求失败', 'error');
      btn.disabled = false;
      btn.textContent = '批准';
    }
  }

  /* ── Reject ── */
  function toggleReject(id) {
    const row = document.getElementById(`reject-row-${id}`);
    row.classList.toggle('open');
    if (row.classList.contains('open')) {
      document.getElementById(`reject-reason-${id}`).focus();
    }
  }

  async function confirmReject(id) {
    const reason = document.getElementById(`reject-reason-${id}`).value.trim();
    try {
      const resp = await fetch('/api/admin/reject', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
        body: JSON.stringify({ id, reason })
      });
      const data = await resp.json();
      showToast(data.message, data.success ? 'success' : 'error');
      if (data.success) loadData();
    } catch {
      showToast('请求失败', 'error');
    }
  }
</script>
</body>
</html>
